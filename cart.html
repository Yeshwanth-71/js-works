<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Cart</title>
    <style>
        .cart-item {
            margin: 20px;
        }
        .cart-img {
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shopping Cart</h1>
        <div id="cart-items" class="row">
            <!-- Cart items will be displayed here -->
        </div>
    </div>

    <script>
        // Fetch cart data from localStorage
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Get the container where cart items will be displayed
        let cartItemsContainer = document.getElementById('cart-items');

        // Check if the cart is empty
        if (cart.length === 0) {
            cartItemsContainer.innerHTML = "<p>Your cart is empty!</p>";
        } else {
            // Loop through the cart items and create HTML for each
            cart.forEach(item => {
                let cartItem = document.createElement('div');
                cartItem.classList.add('col-lg-4', 'col-md-6', 'col-sm-12', 'mb-3', 'cart-item');

                cartItem.innerHTML = `
                <div class="card">
                    <img src="${item.imgSrc}" class="card-img-top cart-img">
                    <div class="card-body">
                        <h5 class="card-title">${item.brand}</h5>
                        <p class="card-text">Price: ${item.price}</p>
                    </div>
                </div>
                `;

                // Append the item to the cart container
                cartItemsContainer.appendChild(cartItem);
            });
        }
    </script>
</body>
</html>
